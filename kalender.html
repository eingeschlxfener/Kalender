<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Calendar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --today-bg: rgba(56, 189, 248, 0.15);
      --danger-color: #ef4444;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .calendar-container {
      width: 100%;
      max-width: 500px;
      background-color: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 16px;
      margin-top: 10px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .calendar-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .nav-btn {
      background-color: var(--border-color);
      color: var(--text-main);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-cell {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      min-height: 55px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .day-cell.empty {
      background-color: transparent;
      border: none;
    }

    .day-number {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .day-cell.today {
      background-color: var(--today-bg);
      border-color: var(--accent-color);
    }

    .day-cell.today .day-number {
      color: var(--accent-color);
    }

    .event-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-color);
      border-radius: 50%;
      margin-top: 4px;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex; justify-content: center; align-items: center;
      display: none;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 350px;
    }

    .modal h3 { margin-bottom: 12px; font-size: 1.1rem; }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input {
      width: 100%; padding: 8px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px; color: var(--text-main);
    }

    .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .btn { padding: 6px 12px; border-radius: 6px; border: none; font-weight: 600; }
    .btn-primary { background-color: var(--accent-color); color: #000; }
    .btn-secondary { background-color: transparent; color: var(--text-muted); }
    .btn-danger { background-color: var(--danger-color); color: #fff; padding: 2px 6px; font-size: 0.7rem; }

    .event-list { margin-bottom: 12px; max-height: 100px; overflow-y: auto; }
    .event-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); padding: 6px; border-radius: 4px; margin-bottom: 4px; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="calendar-container">
    <div class="calendar-header">
      <button class="nav-btn" onclick="changeMonth(-1)">&lt;</button>
      <h2 id="month-year-display"></h2>
      <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>
    </div>

    <div class="weekdays">
      <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
    </div>

    <div class="days-grid" id="days-container"></div>
  </div>

  <div class="modal-overlay" id="event-modal">
    <div class="modal">
      <h3 id="modal-date-title">Termin</h3>
      <div class="event-list" id="day-events-list"></div>
      
      <div class="form-group">
        <label>Titel</label>
        <input type="text" id="event-title" placeholder="z. B. Training">
      </div>
      <div class="form-group">
        <label>Uhrzeit</label>
        <input type="time" id="event-time">
      </div>

      <div class="modal-buttons">
        <button class="btn btn-secondary" onclick="closeModal()">Zu</button>
        <button class="btn btn-primary" onclick="saveEvent()">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    var currentDate = new Date();
    var selectedDateStr = null;
    var events = {};

    try {
      events = JSON.parse(localStorage.getItem('calendar_events')) || {};
    } catch(e) {}

    var monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

    function renderCalendar() {
      var year = currentDate.getFullYear();
      var month = currentDate.getMonth();

      document.getElementById('month-year-display').textContent = monthNames[month] + " " + year;
      var container = document.getElementById('days-container');
      container.innerHTML = '';

      var firstDayIndex = new Date(year, month, 1).getDay() - 1;
      if (firstDayIndex === -1) firstDayIndex = 6;

      var totalDays = new Date(year, month + 1, 0).getDate();

      for (var i = 0; i < firstDayIndex; i++) {
        var empty = document.createElement('div');
        empty.className = 'day-cell empty';
        container.appendChild(empty);
      }

      var today = new Date();
      for (var day = 1; day <= totalDays; day++) {
        (function(d) {
          var dayCell = document.createElement('div');
          dayCell.className = 'day-cell';

          var dateKey = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');

          var dayNumber = document.createElement('div');
          dayNumber.className = 'day-number';
          dayNumber.textContent = d;
          dayCell.appendChild(dayNumber);

          if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
            dayCell.className += ' today';
          }

          if (events[dateKey] && events[dateKey].length > 0) {
            var dot = document.createElement('div');
            dot.className = 'event-dot';
            dayCell.appendChild(dot);
          }

          dayCell.onclick = function() { openModal(dateKey, d, monthNames[month], year); };
          container.appendChild(dayCell);
        })(day);
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function openModal(dateKey, day, monthName, year) {
      selectedDateStr = dateKey;
      document.getElementById('modal-date-title').textContent = day + '. ' + monthName + ' ' + year;
      document.getElementById('event-title').value = '';
      document.getElementById('event-time').value = '';
      renderDayEvents();
      document.getElementById('event-modal').className = 'modal-overlay active';
    }

    function closeModal() {
      document.getElementById('event-modal').className = 'modal-overlay';
    }

    function renderDayEvents() {
      var list = document.getElementById('day-events-list');
      list.innerHTML = '';
      var dayEvents = events[selectedDateStr] || [];

      if (dayEvents.length === 0) {
        list.innerHTML = '<p style="font-size:0.75rem; color:var(--text-muted);">Keine Termine</p>';
        return;
      }

      dayEvents.forEach(function(ev, idx) {
        var item = document.createElement('div');
        item.className = 'event-item';
        item.innerHTML = '<span>' + (ev.time ? ev.time + ' ' : '') + ev.title + '</span><button class="btn btn-danger" onclick="deleteEvent(' + idx + ')">X</button>';
        list.appendChild(item);
      });
    }

    function saveEvent() {
      var title = document.getElementById('event-title').value.trim();
      var time = document.getElementById('event-time').value;
      if (!title) return;

      if (!events[selectedDateStr]) events[selectedDateStr] = [];
      events[selectedDateStr].push({ title: title, time: time });
      
      try { localStorage.setItem('calendar_events', JSON.stringify(events)); } catch(e) {}
      
      closeModal();
      renderCalendar();
    }

    function deleteEvent(idx) {
      events[selectedDateStr].splice(idx, 1);
      if (events[selectedDateStr].length === 0) delete events[selectedDateStr];
      try { localStorage.setItem('calendar_events', JSON.stringify(events)); } catch(e) {}
      renderDayEvents();
      renderCalendar();
    }

    renderCalendar();
  </script>
</body>
</html>
